[project]
name = "long_earn"
version = "1.1.0"
description = "自我进化的量化交易系统"
authors = [
    { name = "shiyz", email = "shiyz@eoutlook.com" },
]
requires-python = "==3.13.*"
dependencies = [
    "pandas>=2.0.0",
    "polars>=1.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.2.0",
    "ollama>=0.2.0",
    "langchain-ollama>=0.2.0",
    "loguru>=0.7.0",
    "faiss-cpu>=1.13.0",
    "langgraph-cli[inmem]>=0.4.3",
    "langgraph-checkpoint-sqlite>=2.0.11",
    "psycopg[binary]>=3.1.0",
    "sqlalchemy>=2.0",
    "xtquant>=2024.01.01",
    "pyyaml>=6.0.0",
    "tavily-python>=0.7.23",
    "httpx>=0.25.0",
    "pyarrow>=24.0.0",
    "akshare>=1.18.64",
    "jieba>=0.42.1",
    "jinja2>=3.1.6",
    "typer>=0.12.0",
    "adbc-driver-postgresql>=1.12.0",
]

[project.scripts]
long_earn = "long_earn.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.15.11",
]
embed = [
    "sentence-transformers>=3.0.0",
]
[tool.uv]
package = true

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[tool.uv.pip]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"


[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
# scripts/ 为一次性研究脚本，不纳入质量门槛（AGENTS.md 卡口为 src/）
# archive/ 为归档死代码（如 archive/strategy_rd_subgraph/），保留供回滚参考，不纳入质量门槛
exclude = [".venv", "build", "dist", "scripts", "archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "C", "PL", "ARG"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "PLR2004", "ARG001", "ARG002", "ARG005", "PLR0913"]
"tests/integration/conftest.py" = ["PLC0415", "PLR2004", "PLR0912", "PLR0915", "PLW2901"]
"scripts/**" = ["PLC0415", "PLR2004", "PLR0913", "PLR0915"]
"src/long_earn/backtest/data/provider.py" = ["I001", "PLC0415", "PLR2004"]
"src/long_earn/backtest/data/connector.py" = ["I001", "PLC0415", "PLR2004"]
"src/long_earn/backtest/data/miniqmt_provider.py" = ["PLR0912", "PLR2004"]
"src/long_earn/backtest/data/ciccwm_client.py" = ["PLC0415", "PLR2004"]
"src/long_earn/backtest/data/ciccwm_provider.py" = ["PLR2004", "ARG002"]
"src/long_earn/backtest/data/akshare_provider.py" = ["ARG002"]
# CLI 故意使用延迟 import（避免 --help 加载整个应用），与 tests//scripts/ 同策略
# download 子命令参数多为 typer Option 声明，PLR0913 不适用
"src/long_earn/cli.py" = ["PLC0415", "PLR0913"]
# 数据下载服务：start_date 保留 for API 一致性；run/download 签名参数多属设计选择
"src/long_earn/services/data_ingestion_service.py" = ["ARG002", "PLR0913"]
# FastAPI 服务入口函数参数多属设计选择
"src/long_earn/app/app.py" = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["long_earn"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=long_earn --cov-report=term --cov-report=html"
python_files = ["test_*.py"]
markers = [
    "regression: 回归测试（防回退，验证已修复的缺陷不再复现）",
    "integration: 需要 PostgreSQL 或外部服务的集成测试（unit 目录内 PG 不可达时 fail）",
]

[tool.coverage.run]
source = ["src/long_earn"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pyright]
# 类型检查配置：入口为 src/long_earn；tests/ 以单文件诊断为主
# （tests 引用 mock 驱动，严格全量校验会大量误报，与 AGENTS.md 门槛一致）
include = ["src"]
exclude = ["**/__pycache__", "**/archive"]
pythonVersion = "3.13"
# 依赖完整解析（polars/pandas/psycopg 等 stubs 缺失时降级 basic 会漏报真错）
typeCheckingMode = "basic"
# 第三方无 stubs 库静默（如 xtquant/akshare），避免 import 噪音
reportMissingImports = true
# 首次启用暂不强开严格模式：核心链路零错优先，后续逐步收紧
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"

[tool.importlinter]
root_package = "long_earn"

[[tool.importlinter.contracts]]
id = "backtest_data_forbidden_dependencies"
name = "数据层不依赖上层模块"
type = "forbidden"
source_modules = ["long_earn.backtest.data"]
forbidden_modules = ["long_earn.backtest.engine", "long_earn.services", "long_earn.tools"]
message = "backtest.data 层不应依赖 engine/services/tools"

[[tool.importlinter.contracts]]
id = "services_forbidden_tools"
name = "服务层不依赖 tools"
type = "forbidden"
source_modules = ["long_earn.services"]
forbidden_modules = ["long_earn.tools"]
message = "services 层不应依赖 tools 模块"

[[tool.importlinter.contracts]]
id = "ontology_forbidden_dependencies"
name = "本体论层不依赖上层模块"
type = "forbidden"
source_modules = ["long_earn.ontology"]
forbidden_modules = ["long_earn.backtest", "long_earn.services", "long_earn.tools", "long_earn.strategy_rd"]
message = "ontology 层不应依赖 backtest/services/tools/strategy_rd 等上层模块"

[[tool.importlinter.contracts]]
id = "substance_forbidden_dependencies"
name = "物质层不依赖上层模块"
type = "forbidden"
source_modules = ["long_earn.substance"]
forbidden_modules = ["long_earn.services", "long_earn.tools", "long_earn.strategy_rd"]
message = "substance 层不应依赖 services/tools/strategy_rd 等上层模块"

[[tool.importlinter.contracts]]
id = "core_forbidden_dependencies"
name = "核心层不依赖上层模块"
type = "forbidden"
source_modules = ["long_earn.core"]
forbidden_modules = ["long_earn.backtest", "long_earn.services", "long_earn.tools", "long_earn.strategy_rd"]
message = "core 层不应依赖 backtest/services/tools/strategy_rd 等上层模块"

[[tool.importlinter.contracts]]
id = "tools_forbidden_app"
name = "工具层不依赖应用层"
type = "forbidden"
source_modules = ["long_earn.tools"]
forbidden_modules = ["long_earn.app"]
message = "tools 层不应依赖 app 组合根（防止反向依赖）"

[[tool.importlinter.contracts]]
id = "backtest_engine_forbidden_dependencies"
name = "引擎层不依赖上层模块"
type = "forbidden"
source_modules = ["long_earn.backtest.engine"]
forbidden_modules = ["long_earn.services", "long_earn.tools", "long_earn.app"]
message = "backtest.engine 层不应依赖 services/tools/app"

[[tool.importlinter.contracts]]
id = "services_forbidden_strategy_rd"
name = "服务层不依赖策略研发上下文"
type = "forbidden"
source_modules = ["long_earn.services"]
forbidden_modules = ["long_earn.strategy_rd"]
message = "services 层不应依赖 strategy_rd 上下文（防止上下文循环依赖）"

[[tool.importlinter.contracts]]
id = "strategy_optimization_forbidden_strategy_rd"
name = "策略优化上下文不依赖策略研发上下文"
type = "forbidden"
source_modules = ["long_earn.strategy_optimization"]
forbidden_modules = ["long_earn.strategy_rd"]
message = "strategy_optimization 不应依赖 strategy_rd（防止上下文循环依赖）"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "import-linter>=2.0",
    "pytest-cov>=7.1.0",
    "types-pyyaml>=6.0.12.20260510",
    "types-pytz>=2026.2.0.20260506",
    "hypothesis>=6.130",
    "pyright>=1.1.400",
    "pandas-stubs>=3.0.0",
]
