# MACD 柱策略（声明式算子 DSL 版）
# 替代旧 MACDHistogramStrategy：用 MACD 算子，filter histogram > 0（多头动能）
# 注：声明式版本不复刻"柱由负转正"状态机，仅表达"当前柱为正"
# 实现要点：MACD 算子返回 macd/signal/histogram 三列，filter_threshold 直接用
# histogram 字段与 0 比较
strategy:
  name: MACDHistogram
  description: MACD 柱策略 — MACD 柱（histogram）> 0 时多头动能
  universe:
    type: main_board+gem
    rebalance_freq: 20D
  start_date: 2024-01-01
  end_date: 2024-12-31
  operator_factors:
    - op: macd
      alias: macd_hist
      params:
        field: close
        fast: 12
        slow: 26
        signal: 9
  signals:
    - type: operator
      op: filter_threshold
      params:
        field: histogram
        op: ">"
        value: 0
    - type: operator
      op: rank_top
      params:
        field: histogram
        top: 10
        ascending: false
  weights:
    method: equal
  risk_control:
    max_position_per_stock: 0.2
    stop_loss: 0.1
    max_drawdown_limit: 0.2
