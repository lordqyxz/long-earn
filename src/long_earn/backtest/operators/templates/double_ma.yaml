# 双均线策略（声明式算子 DSL 版）
# 替代旧 DoubleMAStrategy：用 SMA(5) / SMA(20) 算子 + arithmetic 计算差值
# 注：声明式版本不复刻"金叉/死叉"状态机，仅表达"短均线在长均线之上"的偏多状态
# 实现要点：filter_threshold 仅支持与常量比较，故先用 arithmetic 算子计算
# sma_short - sma_long，再 filter_threshold value=0
strategy:
  name: DoubleMA
  description: 双均线策略 — 短期均线（SMA5）在长期均线（SMA20）之上时偏多
  universe:
    type: main_board+gem
    rebalance_freq: 20D
  start_date: 2024-01-01
  end_date: 2024-12-31
  operator_factors:
    - op: sma
      alias: sma_short
      params:
        field: close
        window: 5
    - op: sma
      alias: sma_long
      params:
        field: close
        window: 20
    - op: arithmetic
      alias: sma_diff
      params:
        lhs: sma_short
        rhs: sma_long
        op: "-"
        alias: sma_diff
  signals:
    - type: operator
      op: filter_threshold
      params:
        field: sma_diff
        op: ">"
        value: 0
    - type: operator
      op: rank_top
      params:
        field: sma_short
        top: 10
        ascending: false
  weights:
    method: equal
  risk_control:
    max_position_per_stock: 0.2
    stop_loss: 0.1
    max_drawdown_limit: 0.2
