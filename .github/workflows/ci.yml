name: CI

on:
  push:
    branches: [main, v*]
  pull_request:
    branches: [main]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - name: ADR-011 grep 卡口 — 禁止 ${var} 提示词占位符
        run: |
          if grep -rn '\${[a-zA-Z_]' src/long_earn --include='*.md' --include='*.py' --include='*.yaml'; then
            echo "❌ 发现 \${var} 形式的提示词占位符（如上）。请使用 jinja2 {{ var }} 语法（ADR-011）。"
            exit 1
          fi
      - name: ADR-021 卡口 — LLM 调用点分层检查
        run: uv run python scripts/check_llm_call_sites.py
      - name: ADR-008 卡口 — 禁止退役语法（${var} / 路径 2 回退）
        run: uv run python scripts/check_deprecated_syntax.py
      # 质量门槛对齐 AGENTS.md：ruff 卡 src/；类型检查以 Serena LSP 为准，不跑 mypy
      - run: uv run ruff check src/
      - run: uv run ruff format --check src/
      - run: uv run lint-imports

  test:
    needs: lint-and-type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest tests/unit/ -v --tb=short
      - name: 集成测试（需要凭证的测试自动跳过）
        run: uv run pytest tests/integration/ -v --tb=short -m "not requires_credentials"
