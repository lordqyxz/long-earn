name: CI

on:
  push:
    branches: [main, v*]
  pull_request:
    branches: [main]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - name: ADR-011 grep 卡口 — 禁止 ${var} 提示词占位符
        run: |
          if grep -rn '\${[a-zA-Z_]' src/long_earn --include='*.md' --include='*.py' --include='*.yaml'; then
            echo "❌ 发现 \${var} 形式的提示词占位符（如上）。请使用 jinja2 {{ var }} 语法（ADR-011）。"
            exit 1
          fi
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/ --ignore-missing-imports
      - run: uv run lint-imports

  test:
    needs: lint-and-type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest tests/unit/ -v --tb=short --cov-fail-under=60
      - name: 集成测试（需要凭证的测试自动跳过）
        run: uv run pytest tests/integration/ -v --tb=short -m "not requires_credentials" || echo "集成测试目录不存在或全部跳过"
