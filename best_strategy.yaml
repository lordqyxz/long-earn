# best_strategy.yaml — 系统当前最佳策略（ADR-009 收尾：算子目录 DSL）
# 20日动量选股策略：选近20日收益率为正且 momentum_5 排名前 5 的股票等权持仓
name: Momentum20Strategy
description: 20日动量选股策略 - operator_factors + filter + rank
universe:
  type: csi300
  rebalance_freq: 20D
operator_factors:
  - op: returns
    alias: momentum_20
    params:
      field: close
      period: 20
  - op: returns
    alias: momentum_5
    params:
      field: close
      period: 5
signals:
  - type: operator
    op: filter_threshold
    params:
      field: momentum_20
      op: ">"
      value: 0
  - type: operator
    op: rank_top
    params:
      field: momentum_5
      top: 5
      ascending: false
weights:
  method: equal
risk_control:
  max_position_per_stock: 0.25
  stop_loss: 0.1
  max_drawdown_limit: 0.2
trading_cost:
  commission_rate: 0.0003
  stamp_duty: 0.0005
  slippage_bps: 2.0
